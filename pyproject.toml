[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-engine"
version = "0.2.7"
description = "Network-spatial economic centrality engine for SIGMA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=16,<27",
  "pyogrio>=0.9,<1",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "shapely>=2.1,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]

[project.scripts]
sigma-engine = "sigma_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"sigma_engine.resources" = ["*.csv", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
